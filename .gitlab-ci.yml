stages:
  - lint
  - unit-test
  - merge-to-test
  - build
  - deploy-test
  - deploy-uat
  - deploy-prod

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/devops-flask-app:$CI_COMMIT_SHA"

# Lint stage
lint:
  stage: lint
  image: python:3.9
  script:
    - pip install flake8
    - flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
  only:
    - merge_requests
    - branches

# Unit tests
unit_tests:
  stage: unit-test
  image: python:3.9
  script:
    - pip install pytest flask
    - pytest backend/tests/
  only:
    - merge_requests
    - branches

# Auto merge into TEST only if unit tests pass
merge_to_test:
  stage: merge-to-test
  image: curlimages/curl:latest
  script:
    - echo "Merging into TEST branch..."
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --form "source_branch=$CI_COMMIT_REF_NAME" \
        --form "target_branch=test" \
        --form "title=Auto-merge $CI_COMMIT_REF_NAME → test" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/repository/merges"
  only:
    - merge_requests
    - branches
  when: on_success   # runs only if lint + unit tests passed

# Build stage
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE_NAME backend/
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker push $IMAGE_NAME
  only:
    - test

# Deploy to TEST
deploy_test:
  stage: deploy-test
  image: python:3.9
  before_script:
    - pip install ansible
    - echo "$env_EC2_SSH_KEY" > ssh_key.pem
    - chmod 600 ssh_key.pem
  script:
    - ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/setup.yml \
        --private-key=ssh_key.pem -u ubuntu -e "target=TEST"
    - ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
        --private-key=ssh_key.pem -u ubuntu -e "target=TEST"
  only:
    - test

# Deploy to UAT (auto merge test → uat)
deploy_uat:
  stage: deploy-uat
  image: python:3.9
  before_script:
    - pip install ansible requests
    - echo "$env_EC2_SSH_KEY" > ssh_key.pem
    - chmod 600 ssh_key.pem
  script:
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --form "source_branch=test" \
        --form "target_branch=uat" \
        --form "title=Auto merge test → uat" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/repository/merges"
    - ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/setup.yml \
        --private-key=ssh_key.pem -u ubuntu -e "target=UAT"
    - ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
        --private-key=ssh_key.pem -u ubuntu -e "target=UAT"
  only:
    - test

# Deploy to PROD (auto merge uat → main)
deploy_prod:
  stage: deploy-prod
  image: python:3.9
  before_script:
    - pip install ansible requests
    - echo "$env_EC2_SSH_KEY" > ssh_key.pem
    - chmod 600 ssh_key.pem
  script:
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --form "source_branch=uat" \
        --form "target_branch=main" \
        --form "title=Auto merge uat → prod" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/repository/merges"
    - ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/setup.yml \
        --private-key=ssh_key.pem -u ubuntu -e "target=PROD"
    - ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
        --private-key=ssh_key.pem -u ubuntu -e "target=PROD"
  only:
    - uat
