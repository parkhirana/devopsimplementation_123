---
- name: Setup EC2 with dependencies
  hosts: TEST
  become: true
  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - docker.io
          - git
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    