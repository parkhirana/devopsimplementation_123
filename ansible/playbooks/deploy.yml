---
- name: Deploy Flask Backend App
  hosts: TEST
  become: yes

  vars:
    image_name: "{{ lookup('env', 'IMAGE_NAME') }}"  # passed from GitLab CI
    container_name: flask-backend
    host_port: 80      # expose app to internet
    container_port: 5000

  tasks:
    - name: Ensure old container is stopped
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Log in to GitLab container registry
      community.docker.docker_login:
        registry_url: registry.gitlab.com
        username: "{{ lookup('env', 'CI_REGISTRY_USER') }}"
        password: "{{ lookup('env', 'CI_REGISTRY_PASSWORD') }}"


    - name: Pull latest Docker image from GitLab registry
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: pull

    - name: Run container with new image
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: always
        ports:
          - "{{ host_port }}:{{ container_port }}"
