name: CI/CD Pipeline

permissions:
  contents: write        # needed to push commits & merge PRs
  pull-requests: write   # needed to create/merge pull requests
  packages: write     

on:
  push:
    branches:
      - main
      - test
      - uat
  pull_request:

jobs:
  # ---------------- Lint ----------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - run: pip install flake8
      - run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # ---------------- Unit Tests ----------------
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - run: pip install pytest flask
      - run: pytest backend/tests/

  # ---------------- Build Docker Image ----------------
  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/test'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & Push Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/devops-flask-app:${{ github.sha }}
          docker build -t $IMAGE_NAME backend/
          docker push $IMAGE_NAME

  # ---------------- Deploy to TEST ----------------
  deploy-test:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/test'
    steps:
      - uses: actions/checkout@v3
      - name: Install Ansible
        run: pip install ansible
      - name: Deploy to TEST
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/setup.yml \
            --private-key=ssh_key.pem -u ubuntu -e "target=TEST"
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
            --private-key=ssh_key.pem -u ubuntu -e "target=TEST"

  # ---------------- Auto Merge TEST → UAT ----------------
  merge-test-to-uat:
    runs-on: ubuntu-latest
    needs: deploy-test
    if: github.ref == 'refs/heads/test'
    steps:
      - uses: actions/checkout@v3
      - name: Create PR test → uat
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: uat
          branch: test
          title: "Auto merge test → uat"
          body: "Promoting code from TEST to UAT"
          merge-method: squash

  # ---------------- Deploy to UAT ----------------
  deploy-uat:
    runs-on: ubuntu-latest
    needs: merge-test-to-uat
    if: github.ref == 'refs/heads/uat'
    steps:
      - uses: actions/checkout@v3
      - name: Install Ansible
        run: pip install ansible requests
      - name: Deploy to UAT
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/setup.yml \
            --private-key=ssh_key.pem -u ubuntu -e "target=UAT"
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
            --private-key=ssh_key.pem -u ubuntu -e "target=UAT"

  # ---------------- Auto Merge UAT → MAIN ----------------
  merge-uat-to-main:
    runs-on: ubuntu-latest
    needs: deploy-uat
    if: github.ref == 'refs/heads/uat'
    steps:
      - uses: actions/checkout@v3
      - name: Create PR uat → main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: uat
          title: "Auto merge UAT → main"
          body: "Promoting code from UAT to PROD"
          merge-method: squash

  # ---------------- Deploy to PROD ----------------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: merge-uat-to-main
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Install Ansible
        run: pip install ansible requests
      - name: Deploy to PROD
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/setup.yml \
            --private-key=ssh_key.pem -u ubuntu -e "target=PROD"
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
            --private-key=ssh_key.pem -u ubuntu -e "target=PROD"
